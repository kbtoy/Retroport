[project]
name = "retroport"
version = "0.5.0"
description = "Retroport Workbench: browse retail WoW items and sets in 3D and backport them to a 3.3.5a client."
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "Pillow>=10.0",          # BLP decode/encode (formats/blp.py, textures.py)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PyQt6>=6.5"]
# The conversion engine, wotlkconv (github.com/Bar3b0n3s/Converter, MIT), comes with retroport:
# its copy is wotlkconv/ (packaging/update_wotlkconv.py refreshes it).

[project.scripts]
retroport = "retroport.cli:main"

[project.gui-scripts]
retroport-gui = "gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retroport*", "gui*", "wotlkconv*"]

[tool.setuptools.package-data]
"retroport.glue" = ["ui/*.lua", "ui/*.xml"]
"retroport.workbench" = ["static/*"]
"wotlkconv" = ["LICENSE", "VENDORED.md"]
"wotlkconv.db" = ["builtin/*.json"]
